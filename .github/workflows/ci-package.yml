name: CI - Publish and Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Version
        id: version
        shell: bash
        run: |
          VER=$(date +'%Y-%m-%d')-${{ github.run_number }}
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "$VER" > version.txt

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --paths src --add-data "version.txt;." --add-data "assets/splash.png;." --add-data "assets/app_icon.png;." --name "WindowsScalerAlternative" --icon "assets/app_icon.ico" --distpath dist --workpath build --specpath . src/main.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.APP_VERSION }} setup.iss

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: WindowsScalerAlternative EXE
          path: dist/WindowsScalerAlternative.exe

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: WindowsScalerAlternative Installer
          path: dist/WindowsScalerAlternative-${{ env.APP_VERSION }}.exe
